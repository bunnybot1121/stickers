<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <filter id="heart-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="4" flood-color="#181A26" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="holoFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="30%" stop-color="#A855F7"/>
      <stop offset="70%" stop-color="#FF6EB4"/>
      <stop offset="100%" stop-color="#FACC15"/>
    </linearGradient>
  </defs>

  <g filter="url(#heart-shadow)">
    <!-- White Die-Cut Silhouette Contour -->
    <path d="M 100 165 L 40 100 C 15 70, 45 30, 80 45 C 92 50, 100 62, 100 62 C 100 62, 108 50, 120 45 C 155 30, 185 70, 160 100 Z" 
          fill="#FFFFFF" stroke="#FFFFFF" stroke-width="16" stroke-linejoin="round"/>

    <!-- Geometric Faceted Crystal Heart -->
    <polygon points="100,62 80,45 50,60 40,100 100,165" fill="url(#holoFoil)" stroke="#181A26" stroke-width="4"/>
    <polygon points="100,62 120,45 150,60 160,100 100,165" fill="url(#holoFoil)" stroke="#181A26" stroke-width="4"/>

    <!-- Crystal Facets -->
    <polygon points="100,62 60,95 100,120" fill="#FFFFFF" opacity="0.35" stroke="#181A26" stroke-width="2"/>
    <polygon points="100,62 140,95 100,120" fill="#FFFFFF" opacity="0.2" stroke="#181A26" stroke-width="2"/>
    <polygon points="100,120 40,100 100,165" fill="#C084FC" opacity="0.4" stroke="#181A26" stroke-width="2"/>
    <polygon points="100,120 160,100 100,165" fill="#38BDF8" opacity="0.4" stroke="#181A26" stroke-width="2"/>

    <!-- Sparkles -->
    <polygon points="155,42 158,50 166,53 158,56 155,64 152,56 144,53 152,50" fill="#FACC15" stroke="#181A26" stroke-width="2"/>
    <polygon points="45,45 47,51 53,53 47,55 45,61 43,55 37,53 43,51" fill="#FFFFFF" stroke="#181A26" stroke-width="2"/>
  </g>
</svg>