<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <filter id="brain-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="4" flood-color="#181A26" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="brainPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#DB2777"/>
    </linearGradient>
  </defs>

  <g filter="url(#brain-shadow)">
    <!-- White Die-Cut Silhouette Contour -->
    <path d="M 45 100 C 35 60, 80 40, 100 50 C 120 40, 165 60, 155 100 C 165 140, 125 155, 100 150 C 75 155, 35 140, 45 100 Z" 
          fill="#FFFFFF" stroke="#FFFFFF" stroke-width="16" stroke-linejoin="round"/>

    <!-- Brain Shape -->
    <path d="M 48 100 C 40 65, 80 45, 100 54 C 120 45, 160 65, 152 100 C 160 135, 125 150, 100 146 C 75 150, 40 135, 48 100 Z" 
          fill="url(#brainPink)" stroke="#181A26" stroke-width="4.5" stroke-linejoin="round"/>

    <!-- Brain Folds Lines -->
    <path d="M 68 85 C 62 95, 75 110, 85 105" fill="none" stroke="#9D174D" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 132 85 C 138 95, 125 110, 115 105" fill="none" stroke="#9D174D" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 85 70 Q 100 80 115 70" fill="none" stroke="#9D174D" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="100" y1="54" x2="100" y2="146" stroke="#181A26" stroke-width="3.5"/>

    <!-- Band-Aid across front -->
    <rect x="74" y="90" width="52" height="18" rx="4" transform="rotate(-10 100 100)" fill="#FDE047" stroke="#181A26" stroke-width="3"/>
    <circle cx="95" cy="98" r="1.5" fill="#B45309"/>
    <circle cx="105" cy="100" r="1.5" fill="#B45309"/>

    <!-- "404" Badge -->
    <rect x="80" y="118" width="40" height="16" rx="4" fill="#181A26"/>
    <text x="100" y="130" font-family="'Impact', sans-serif" font-size="11" font-weight="900" fill="#38BDF8" text-anchor="middle">404</text>
  </g>
</svg>