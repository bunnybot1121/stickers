<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <filter id="cart-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="4" flood-color="#181A26" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6EB4"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="cartPlastic" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <g filter="url(#cart-shadow)">
    <!-- White Die-Cut Silhouette Contour -->
    <path d="M 45 40 L 155 40 L 155 160 L 140 160 L 140 148 L 60 148 L 60 160 L 45 160 Z" 
          fill="#FFFFFF" stroke="#FFFFFF" stroke-width="16" stroke-linejoin="round"/>

    <!-- Main Cartridge Outer Shell -->
    <path d="M 45 40 L 155 40 L 155 160 L 140 160 L 140 148 L 60 148 L 60 160 L 45 160 Z" 
          fill="url(#cartPlastic)" stroke="#181A26" stroke-width="5" stroke-linejoin="round"/>

    <!-- Grip Ridges at top -->
    <rect x="58" y="47" width="84" height="4" rx="2" fill="#0369A1"/>
    <rect x="58" y="55" width="84" height="4" rx="2" fill="#0369A1"/>
    <rect x="58" y="63" width="84" height="4" rx="2" fill="#0369A1"/>

    <!-- Holographic Center Label -->
    <rect x="58" y="74" width="84" height="66" rx="4" fill="#181A26" stroke="#181A26" stroke-width="3"/>
    <rect x="62" y="78" width="76" height="58" rx="2" fill="url(#neonPink)"/>

    <!-- Pixel D-Pad and Buttons on Label -->
    <!-- D-Pad -->
    <rect x="74" y="94" width="8" height="24" fill="#FACC15" rx="1"/>
    <rect x="66" y="102" width="24" height="8" fill="#FACC15" rx="1"/>
    <!-- Buttons A and B -->
    <circle cx="118" cy="110" r="5" fill="#FACC15" stroke="#181A26" stroke-width="2"/>
    <circle cx="128" cy="100" r="5" fill="#38BDF8" stroke="#181A26" stroke-width="2"/>

    <!-- Mini Title Pixel Text -->
    <text x="100" y="90" font-family="'Courier New', monospace" font-size="10" font-weight="900" fill="#FFFFFF" text-anchor="middle">SUPER 16</text>

    <!-- Metallic Pins at Bottom -->
    <rect x="68" y="148" width="8" height="8" fill="#F59E0B"/>
    <rect x="84" y="148" width="8" height="8" fill="#F59E0B"/>
    <rect x="100" y="148" width="8" height="8" fill="#F59E0B"/>
    <rect x="116" y="148" width="8" height="8" fill="#F59E0B"/>

    <!-- Glossy Highlight across Cart -->
    <polygon points="46,42 85,42 50,158 46,158" fill="#FFFFFF" opacity="0.35"/>
  </g>
</svg>