<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <filter id="onigiri-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="4" flood-color="#181A26" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="matchaPowder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BEF264"/>
      <stop offset="100%" stop-color="#84CC16"/>
    </linearGradient>
  </defs>

  <g filter="url(#onigiri-shadow)">
    <!-- White Die-Cut Silhouette Contour -->
    <path d="M 100 35 C 130 50, 160 125, 150 152 C 140 162, 60 162, 50 152 C 40 125, 70 50, 100 35 Z" 
          fill="#FFFFFF" stroke="#FFFFFF" stroke-width="16" stroke-linejoin="round"/>

    <!-- Rice Body -->
    <path d="M 100 40 C 130 55, 155 125, 146 150 C 138 158, 62 158, 54 150 C 45 125, 70 55, 100 40 Z" 
          fill="#FFFFFF" stroke="#181A26" stroke-width="4.5" stroke-linejoin="round"/>

    <!-- Matcha Green Powder Dusting on top half -->
    <path d="M 100 40 C 120 50, 138 90, 132 100 C 115 95, 85 95, 68 100 C 62 90, 80 50, 100 40 Z" 
          fill="url(#matchaPowder)" opacity="0.85"/>

    <!-- Seaweed (Nori) Belt at Bottom -->
    <rect x="78" y="122" width="44" height="34" rx="5" fill="#14532D" stroke="#181A26" stroke-width="4"/>

    <!-- Cute Anime Face -->
    <ellipse cx="82" cy="108" rx="4.5" ry="6" fill="#181A26"/>
    <ellipse cx="118" cy="108" rx="4.5" ry="6" fill="#181A26"/>
    <circle cx="80.5" cy="106" r="1.5" fill="#FFFFFF"/>
    <circle cx="116.5" cy="106" r="1.5" fill="#FFFFFF"/>

    <!-- Pink Cheeks -->
    <ellipse cx="73" cy="116" rx="6" ry="3.5" fill="#FF6EB4" opacity="0.8"/>
    <ellipse cx="127" cy="116" rx="6" ry="3.5" fill="#FF6EB4" opacity="0.8"/>

    <!-- Cute Smiling Mouth -->
    <path d="M 96 114 Q 100 119 104 114" fill="none" stroke="#181A26" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>