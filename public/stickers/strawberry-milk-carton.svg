<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <filter id="milk-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="4" flood-color="#181A26" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="milkPink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCE7F3"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
  </defs>

  <g filter="url(#milk-shadow)">
    <!-- White Die-Cut Silhouette Contour -->
    <path d="M 60 40 L 140 40 L 155 80 L 155 160 L 45 160 L 45 80 Z" 
          fill="#FFFFFF" stroke="#FFFFFF" stroke-width="16" stroke-linejoin="round"/>

    <!-- Straw protruding from top -->
    <line x1="85" y1="20" x2="105" y2="48" stroke="#EF4444" stroke-width="8" stroke-linecap="round"/>
    <line x1="85" y1="20" x2="105" y2="48" stroke="#181A26" stroke-width="2" stroke-linecap="round"/>

    <!-- Carton Gable Top -->
    <polygon points="65,45 135,45 150,80 50,80" fill="#FBCFE8" stroke="#181A26" stroke-width="4.5" stroke-linejoin="round"/>

    <!-- Carton Main Front Body -->
    <rect x="50" y="80" width="100" height="80" rx="4" fill="url(#milkPink)" stroke="#181A26" stroke-width="4.5"/>

    <!-- Japanese Strawberry Icon in Center -->
    <!-- Strawberry body -->
    <path d="M 100 135 C 80 115, 80 100, 100 102 C 120 100, 120 115, 100 135 Z" fill="#EF4444" stroke="#181A26" stroke-width="2.5"/>
    <!-- Strawberry Leaves -->
    <polygon points="100,98 94,95 97,102 100,100 103,102 106,95" fill="#22C55E"/>
    <!-- Seeds -->
    <circle cx="95" cy="112" r="1" fill="#FACC15"/>
    <circle cx="105" cy="112" r="1" fill="#FACC15"/>
    <circle cx="100" cy="122" r="1" fill="#FACC15"/>

    <!-- Japanese Text: いちご (Ichigo) -->
    <text x="100" y="94" font-family="'Courier New', sans-serif" font-size="10" font-weight="900" fill="#BE185D" text-anchor="middle">いちご MILK</text>

    <!-- Side barcode stripe -->
    <line x1="58" y1="140" x2="58" y2="152" stroke="#181A26" stroke-width="2"/>
    <line x1="62" y1="140" x2="62" y2="152" stroke="#181A26" stroke-width="3"/>
    <line x1="68" y1="140" x2="68" y2="152" stroke="#181A26" stroke-width="1.5"/>
  </g>
</svg>