<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <filter id="py-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="4" flood-color="#181A26" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="pyBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="pyYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
  </defs>

  <g filter="url(#py-shadow)">
    <!-- White Die-Cut Silhouette Contour -->
    <path d="M 50 50 C 45 35, 125 35, 120 50 L 120 75 L 75 75 L 75 90 L 140 90 C 155 90, 155 155, 140 155 L 80 155 C 65 155, 65 130, 80 130 L 125 130 L 125 115 L 60 115 C 45 115, 45 65, 50 50 Z" 
          fill="#FFFFFF" stroke="#FFFFFF" stroke-width="18" stroke-linejoin="round"/>

    <!-- Blue Top Python Segment -->
    <path d="M 60 52 C 55 38, 120 38, 115 52 L 115 82 L 80 82 C 65 82, 60 70, 60 52 Z" 
          fill="url(#pyBlue)" stroke="#181A26" stroke-width="4.5" stroke-linejoin="round"/>
    <circle cx="78" cy="52" r="4.5" fill="#FFFFFF"/>
    <circle cx="78" cy="52" r="2.5" fill="#181A26"/>

    <!-- Yellow Bottom Python Segment -->
    <path d="M 140 148 C 145 162, 80 162, 85 148 L 85 118 L 120 118 C 135 118, 140 130, 140 148 Z" 
          fill="url(#pyYellow)" stroke="#181A26" stroke-width="4.5" stroke-linejoin="round"/>
    <circle cx="122" cy="148" r="4.5" fill="#FFFFFF"/>
    <circle cx="122" cy="148" r="2.5" fill="#181A26"/>

    <!-- Mini Espresso Cup between python segments -->
    <rect x="88" y="90" width="24" height="20" rx="4" fill="#FFFFFF" stroke="#181A26" stroke-width="3"/>
    <path d="M 112 94 C 119 94, 119 106, 112 106" fill="none" stroke="#181A26" stroke-width="3" stroke-linecap="round"/>
    <!-- Steam Squiggles -->
    <path d="M 94 85 Q 92 78 94 72" fill="none" stroke="#FACC15" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 104 85 Q 106 78 104 72" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>