<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <filter id="mug-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="4" flood-color="#181A26" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="fireOuter" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="60%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FACC15"/>
    </linearGradient>
    <linearGradient id="fireInner" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </linearGradient>
  </defs>

  <g filter="url(#mug-shadow)">
    <!-- White Die-Cut Silhouette Contour -->
    <path d="M 40 145 C 30 110, 45 70, 70 85 C 75 55, 95 35, 110 50 C 130 35, 155 60, 150 90 C 165 95, 172 135, 160 145 C 165 155, 150 162, 50 162 C 40 162, 35 155, 40 145 Z" 
          fill="#FFFFFF" stroke="#FFFFFF" stroke-width="16" stroke-linejoin="round"/>

    <!-- Outer Roaring Flame Background -->
    <path d="M 42 145 C 32 110, 48 72, 72 86 C 76 56, 96 36, 112 52 C 132 36, 156 62, 152 92 C 166 96, 170 136, 158 145 C 162 155, 148 160, 48 160 Z" 
          fill="url(#fireOuter)" stroke="#181A26" stroke-width="4.5" stroke-linejoin="round"/>

    <!-- Inner Hot Yellow Core Flame -->
    <path d="M 58 145 C 50 120, 62 90, 80 102 C 86 80, 100 68, 112 80 C 126 70, 142 90, 138 112 C 148 118, 148 145, 138 152 Z" 
          fill="url(#fireInner)" stroke="#181A26" stroke-width="3" stroke-linejoin="round"/>

    <!-- Cute Smiling Ceramic Mug -->
    <rect x="70" y="98" width="56" height="52" rx="8" fill="#FFFFFF" stroke="#181A26" stroke-width="4.5"/>
    <!-- Mug Handle -->
    <path d="M 126 108 C 144 108, 144 140, 126 140" fill="none" stroke="#181A26" stroke-width="5" stroke-linecap="round"/>
    <path d="M 126 114 C 136 114, 136 134, 126 134" fill="none" stroke="#FFFFFF" stroke-width="3"/>

    <!-- Coffee Liquid line -->
    <line x1="74" y1="104" x2="122" y2="104" stroke="#78350F" stroke-width="4" stroke-linecap="round"/>

    <!-- Cartoon Derp Face -->
    <circle cx="86" cy="120" r="4.5" fill="#181A26"/>
    <circle cx="110" cy="120" r="4.5" fill="#181A26"/>
    <circle cx="84.5" cy="118.5" r="1.5" fill="#FFFFFF"/>
    <circle cx="108.5" cy="118.5" r="1.5" fill="#FFFFFF"/>

    <!-- Pink Derp Cheeks -->
    <ellipse cx="78" cy="127" rx="5" ry="3" fill="#FF6EB4" opacity="0.8"/>
    <ellipse cx="118" cy="127" rx="5" ry="3" fill="#FF6EB4" opacity="0.8"/>

    <!-- Unbothered Smile -->
    <path d="M 94 128 Q 98 134 102 128" fill="none" stroke="#181A26" stroke-width="3" stroke-linecap="round"/>

    <!-- "THIS IS FINE" Banner on Mug -->
    <rect x="74" y="137" width="48" height="10" rx="3" fill="#EF4444" stroke="#181A26" stroke-width="1.5"/>
    <text x="98" y="145" font-family="'Impact', sans-serif" font-size="7" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">THIS IS FINE</text>
  </g>
</svg>