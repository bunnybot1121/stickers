<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <filter id="neko-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="4" flood-color="#181A26" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="soupGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <linearGradient id="bowlGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
  </defs>

  <g filter="url(#neko-shadow)">
    <!-- White Die-Cut Silhouette Contour -->
    <path d="M 40 100 C 35 155, 165 155, 160 100 C 165 60, 135 45, 100 45 C 65 45, 35 60, 40 100 Z" 
          fill="#FFFFFF" stroke="#FFFFFF" stroke-width="16" stroke-linejoin="round"/>

    <!-- Ramen Bowl Red Base -->
    <path d="M 42 105 C 45 160, 155 160, 158 105 Z" fill="url(#bowlGrad)" stroke="#181A26" stroke-width="4.5" stroke-linejoin="round"/>
    <ellipse cx="100" cy="105" rx="58" ry="12" fill="url(#soupGrad)" stroke="#181A26" stroke-width="4"/>

    <!-- Calico Cat Sleeping on Top -->
    <path d="M 68 95 C 65 60, 135 60, 132 95 C 130 110, 70 110, 68 95 Z" fill="#FFFFFF" stroke="#181A26" stroke-width="4" stroke-linejoin="round"/>

    <!-- Cat Ears -->
    <polygon points="72,70 65,48 85,60" fill="#F97316" stroke="#181A26" stroke-width="3.5" stroke-linejoin="round"/>
    <polygon points="128,70 135,48 115,60" fill="#181A26" stroke="#181A26" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- Sleeping Eyes ^ ^ -->
    <path d="M 85 82 Q 90 77 95 82" fill="none" stroke="#181A26" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 105 82 Q 110 77 115 82" fill="none" stroke="#181A26" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Pink Nose & Cheeks -->
    <polygon points="98,87 102,87 100,90" fill="#FF6EB4"/>
    <circle cx="78" cy="85" r="4.5" fill="#FF6EB4" opacity="0.8"/>
    <circle cx="122" cy="85" r="4.5" fill="#FF6EB4" opacity="0.8"/>

    <!-- Narutomaki (Fish Cake) floating next to cat -->
    <circle cx="132" cy="105" r="9" fill="#FFFFFF" stroke="#181A26" stroke-width="2"/>
    <path d="M 132 105 C 130 102, 134 102, 132 105" fill="none" stroke="#EC4899" stroke-width="3" stroke-linecap="round"/>

    <!-- Pair of Wooden Chopsticks -->
    <line x1="45" y1="85" x2="155" y2="72" stroke="#B45309" stroke-width="4" stroke-linecap="round"/>
    <line x1="45" y1="90" x2="155" y2="77" stroke="#B45309" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>