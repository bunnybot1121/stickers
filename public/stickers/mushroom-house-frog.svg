<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <filter id="frog-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="4" flood-color="#181A26" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="frogSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#86EFAC"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="shroomCap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F87171"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
  </defs>

  <g filter="url(#frog-shadow)">
    <!-- White Die-Cut Silhouette Contour -->
    <path d="M 40 100 C 35 45, 165 45, 160 100 C 160 110, 145 110, 140 155 C 130 162, 70 162, 60 155 C 55 110, 40 110, 40 100 Z" 
          fill="#FFFFFF" stroke="#FFFFFF" stroke-width="16" stroke-linejoin="round"/>

    <!-- Mushroom Cap -->
    <path d="M 42 102 C 38 48, 162 48, 158 102 C 145 110, 55 110, 42 102 Z" 
          fill="url(#shroomCap)" stroke="#181A26" stroke-width="4.5" stroke-linejoin="round"/>

    <!-- Polka Dots on Mushroom -->
    <circle cx="75" cy="72" r="12" fill="#FFFFFF"/>
    <circle cx="125" cy="70" r="14" fill="#FFFFFF"/>
    <circle cx="100" cy="56" r="9" fill="#FFFFFF"/>
    <circle cx="50" cy="92" r="7" fill="#FFFFFF"/>
    <circle cx="148" cy="92" r="8" fill="#FFFFFF"/>

    <!-- Mushroom Stem -->
    <path d="M 72 108 L 68 152 C 75 158, 125 158, 132 152 L 128 108 Z" 
          fill="#FEF3C7" stroke="#181A26" stroke-width="4.5" stroke-linejoin="round"/>

    <!-- Cute Little Frog Peeking at Base -->
    <path d="M 78 128 C 76 112, 124 112, 122 128 C 124 145, 76 145, 78 128 Z" 
          fill="url(#frogSkin)" stroke="#181A26" stroke-width="3.5"/>

    <!-- Frog Big Eyes -->
    <circle cx="85" cy="118" r="7" fill="url(#frogSkin)" stroke="#181A26" stroke-width="3"/>
    <circle cx="115" cy="118" r="7" fill="url(#frogSkin)" stroke="#181A26" stroke-width="3"/>
    <circle cx="85" cy="118" r="4.5" fill="#181A26"/>
    <circle cx="115" cy="118" r="4.5" fill="#181A26"/>
    <circle cx="83.5" cy="116.5" r="1.8" fill="#FFFFFF"/>
    <circle cx="113.5" cy="116.5" r="1.8" fill="#FFFFFF"/>

    <!-- Frog Cheeks & Mouth -->
    <circle cx="78" cy="130" r="4" fill="#FF6EB4" opacity="0.8"/>
    <circle cx="122" cy="130" r="4" fill="#FF6EB4" opacity="0.8"/>
    <path d="M 96 128 Q 100 133 104 128" fill="none" stroke="#181A26" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Tiny flower next to stem -->
    <circle cx="62" cy="148" r="5" fill="#FACC15" stroke="#181A26" stroke-width="2"/>
    <circle cx="58" cy="144" r="3" fill="#FFFFFF"/>
    <circle cx="66" cy="144" r="3" fill="#FFFFFF"/>
    <circle cx="58" cy="152" r="3" fill="#FFFFFF"/>
    <circle cx="66" cy="152" r="3" fill="#FFFFFF"/>
  </g>
</svg>