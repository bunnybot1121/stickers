<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <filter id="dumpster-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="4" flood-color="#181A26" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="dumpsterGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="fireChaos" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="60%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#FACC15"/>
    </linearGradient>
  </defs>

  <g filter="url(#dumpster-shadow)">
    <!-- White Die-Cut Silhouette Contour -->
    <path d="M 40 100 C 35 60, 55 40, 80 50 C 95 30, 125 35, 130 55 C 155 45, 165 70, 160 100 L 165 145 C 165 158, 155 162, 145 162 L 55 162 C 45 162, 35 158, 35 145 Z" 
          fill="#FFFFFF" stroke="#FFFFFF" stroke-width="16" stroke-linejoin="round"/>

    <!-- Chaotic Fire Bursting Out -->
    <path d="M 45 105 C 38 65, 60 45, 82 55 C 98 32, 124 38, 130 58 C 154 48, 162 75, 155 105 Z" 
          fill="url(#fireChaos)" stroke="#181A26" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M 65 100 C 60 75, 75 60, 92 70 C 105 52, 122 58, 126 72 C 142 65, 148 85, 142 100 Z" 
          fill="#FEF08A" stroke="#181A26" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Green Metal Dumpster Body -->
    <polygon points="45,105 155,105 145,155 55,155" fill="url(#dumpsterGreen)" stroke="#181A26" stroke-width="4.5" stroke-linejoin="round"/>
    <!-- Lid Hinges / Rim -->
    <rect x="40" y="102" width="120" height="8" rx="3" fill="#14532D" stroke="#181A26" stroke-width="3"/>

    <!-- Dumpster Front Panel Ribs -->
    <line x1="75" y1="114" x2="72" y2="150" stroke="#14532D" stroke-width="3.5"/>
    <line x1="100" y1="114" x2="100" y2="150" stroke="#14532D" stroke-width="3.5"/>
    <line x1="125" y1="114" x2="128" y2="150" stroke="#14532D" stroke-width="3.5"/>

    <!-- Wheels at Bottom -->
    <circle cx="62" cy="158" r="5" fill="#181A26"/>
    <circle cx="138" cy="158" r="5" fill="#181A26"/>

    <!-- Year Badge "2026" -->
    <rect x="80" y="125" width="40" height="16" rx="4" fill="#181A26"/>
    <text x="100" y="137" font-family="'Impact', sans-serif" font-size="11" font-weight="900" fill="#FACC15" text-anchor="middle">2026</text>
  </g>
</svg>