<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <filter id="wiz-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="4" flood-color="#181A26" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="hatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6B21A8"/>
    </linearGradient>
  </defs>

  <g filter="url(#wiz-shadow)">
    <!-- White Die-Cut Silhouette Contour -->
    <path d="M 100 25 L 145 95 L 165 105 L 140 115 L 135 155 C 135 162, 65 162, 65 155 L 60 115 L 35 105 L 55 95 Z" 
          fill="#FFFFFF" stroke="#FFFFFF" stroke-width="16" stroke-linejoin="round"/>

    <!-- Pointy Wizard Hat -->
    <path d="M 100 28 L 142 95 L 58 95 Z" fill="url(#hatGrad)" stroke="#181A26" stroke-width="4.5" stroke-linejoin="round"/>
    <ellipse cx="100" cy="95" rx="55" ry="12" fill="#7E22CE" stroke="#181A26" stroke-width="4"/>

    <!-- Yellow Star on Hat -->
    <polygon points="100,52 103,60 112,62 105,68 107,76 100,71 93,76 95,68 88,62 97,60" fill="#FACC15" stroke="#181A26" stroke-width="2"/>

    <!-- Fluffy White Beard -->
    <path d="M 72 105 C 65 150, 135 150, 128 105 Z" fill="#FFFFFF" stroke="#181A26" stroke-width="4" stroke-linejoin="round"/>

    <!-- Glowing Mini Terminal Screen nested in Beard -->
    <rect x="74" y="112" width="52" height="34" rx="4" fill="#181A26" stroke="#06B6D4" stroke-width="3"/>
    <text x="82" y="128" font-family="'Courier New', monospace" font-size="12" font-weight="900" fill="#06B6D4">&gt;_</text>
    <rect x="100" y="118" width="6" height="12" fill="#22C55E"/>
    <text x="82" y="140" font-family="'Courier New', monospace" font-size="7" font-weight="900" fill="#22C55E">npm build</text>

    <!-- Wizard Glowing Eyes above Beard -->
    <circle cx="86" cy="100" r="3.5" fill="#06B6D4"/>
    <circle cx="114" cy="100" r="3.5" fill="#06B6D4"/>
  </g>
</svg>