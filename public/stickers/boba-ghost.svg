<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <filter id="sticker-diecut" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="4" flood-color="#181A26" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="taroGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E9D5FF"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="teaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DDD6FE"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
  </defs>

  <g filter="url(#sticker-diecut)">
    <!-- White Die-Cut Silhouette Border -->
    <path d="M 45 130 C 40 60, 65 30, 100 30 C 135 30, 160 60, 155 130 C 150 148, 138 140, 130 148 C 122 154, 110 146, 100 152 C 90 146, 78 154, 70 148 C 62 140, 50 148, 45 130 Z" 
          fill="#FFFFFF" stroke="#FFFFFF" stroke-width="14" stroke-linejoin="round"/>

    <!-- Ghost Outer Contour -->
    <path d="M 45 130 C 40 60, 65 30, 100 30 C 135 30, 160 60, 155 130 C 150 148, 138 140, 130 148 C 122 154, 110 146, 100 152 C 90 146, 78 154, 70 148 C 62 140, 50 148, 45 130 Z" 
          fill="#FFFFFF" stroke="#181A26" stroke-width="4.5" stroke-linejoin="round"/>

    <!-- Boba Cup Body -->
    <rect x="80" y="96" width="40" height="48" rx="7" fill="url(#teaGrad)" stroke="#181A26" stroke-width="4"/>
    <rect x="76" y="93" width="48" height="7" rx="3.5" fill="#FFFFFF" stroke="#181A26" stroke-width="3.5"/>

    <!-- Pink Straw -->
    <line x1="100" y1="74" x2="100" y2="106" stroke="#FF6EB4" stroke-width="6" stroke-linecap="round"/>
    <line x1="100" y1="74" x2="100" y2="106" stroke="#181A26" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Tapioca Pearls inside Cup -->
    <circle cx="89" cy="132" r="4.5" fill="#181A26"/>
    <circle cx="101" cy="134" r="4.5" fill="#181A26"/>
    <circle cx="112" cy="131" r="4.5" fill="#181A26"/>
    <circle cx="95" cy="122" r="4" fill="#181A26"/>
    <circle cx="107" cy="123" r="4" fill="#181A26"/>

    <!-- Ghost Cute Anime Eyes -->
    <ellipse cx="76" cy="80" rx="5" ry="7.5" fill="#181A26"/>
    <ellipse cx="124" cy="80" rx="5" ry="7.5" fill="#181A26"/>
    <!-- Catchlights -->
    <circle cx="74" cy="77" r="2.2" fill="#FFFFFF"/>
    <circle cx="122" cy="77" r="2.2" fill="#FFFFFF"/>

    <!-- Blush Cheeks -->
    <ellipse cx="66" cy="90" rx="8" ry="4.5" fill="#FF6EB4" opacity="0.8"/>
    <ellipse cx="134" cy="90" rx="8" ry="4.5" fill="#FF6EB4" opacity="0.8"/>

    <!-- Tiny Kawaii Open Mouth -->
    <path d="M 97 88 Q 100 93 103 88 Z" fill="#FF6EB4" stroke="#181A26" stroke-width="2"/>

    <!-- Floating Magical Sparkles -->
    <polygon points="152,48 155,57 164,60 155,63 152,72 149,63 140,60 149,57" fill="#FACC15" stroke="#181A26" stroke-width="2"/>
    <polygon points="48,46 50,52 56,54 50,56 48,62 46,56 40,54 46,52" fill="#FF6EB4" stroke="#181A26" stroke-width="2"/>
  </g>
</svg>